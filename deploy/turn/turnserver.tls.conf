# coturn with plain TURN/STUN on 3478 and TURN over TLS on 5349.
# Replace values before deploying.

listening-port=3478
tls-listening-port=5349

min-port=49152
max-port=65535

lt-cred-mech
user=zov:CHANGE_ME_LONG_PASSWORD
realm=turn.example.com

# Public IP of the VPS. If the VPS is behind NAT, use PUBLIC_IP/PRIVATE_IP.
external-ip=CHANGE_ME_PUBLIC_IP

# Certificate files are mounted by docker-compose.tls.yml.
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem

fingerprint
no-multicast-peers
no-loopback-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=127.0.0.0-127.255.255.255

log-file=stdout
simple-log
