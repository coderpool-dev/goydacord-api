services:
  coturn:
    image: coturn/coturn:4.6.2
    container_name: zovcord-turn
    restart: unless-stopped
    # host-сеть обязательна: coturn раздаёт relay на диапазоне UDP-портов,
    # и пробрасывать каждый порт через bridge неэффективно.
    network_mode: host
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]
